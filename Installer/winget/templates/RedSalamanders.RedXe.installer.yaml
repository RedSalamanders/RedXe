# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: RedSalamanders.RedXe
PackageVersion: {VERSION}
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.19041.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: RedXeLauncher.exe
    PortableCommandAlias: RedXe
UpgradeBehavior: install
Commands:
  - RedXe
InstallationMetadata:
  Files:
    - RelativeFilePath: RedXeLauncher.exe
      FileType: launch
      DisplayName: RedXe
ReleaseDate: {RELEASE_DATE}
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/RedSalamanders/RedXe/releases/download/v{VERSION}/RedXe-{VERSION}-x64-Portable.zip
    InstallerSha256: {X64_SHA256}
  - Architecture: arm64
    InstallerUrl: https://github.com/RedSalamanders/RedXe/releases/download/v{VERSION}/RedXe-{VERSION}-ARM64-Portable.zip
    InstallerSha256: {ARM64_SHA256}
ManifestType: installer
ManifestVersion: 1.12.0
