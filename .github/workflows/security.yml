name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@235b2a78edb9d4bf1d8687606fc68bd6840007f5
    with:
      engine_ref: 235b2a78edb9d4bf1d8687606fc68bd6840007f5
