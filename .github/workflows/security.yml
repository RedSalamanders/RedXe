name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@a0db31a5d4a57ed7275333d1f47b1b1c0efb9bee
    with:
      engine_ref: a0db31a5d4a57ed7275333d1f47b1b1c0efb9bee
