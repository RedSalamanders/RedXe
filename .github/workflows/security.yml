name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@dd0ab778a2aa9ab13699db19baef0e41ac3bd82c
    with:
      engine_ref: dd0ab778a2aa9ab13699db19baef0e41ac3bd82c
