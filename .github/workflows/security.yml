name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@a6fbe82d83ece48b822ee656a69bdc16921bbc03
    with:
      engine_ref: a6fbe82d83ece48b822ee656a69bdc16921bbc03
