name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@07bc6f1e56804390bd5b2ecfdd4027fac2493049
    with:
      engine_ref: 07bc6f1e56804390bd5b2ecfdd4027fac2493049
