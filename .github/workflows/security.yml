  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@008fb75d3a66138976b6beceb6df0d75dbb424cc
    with:
      engine_ref: 008fb75d3a66138976b6beceb6df0d75dbb424cc
