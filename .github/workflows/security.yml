name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@cd9f01d1711d1abce1856ca4052f49e93eaef3ac
    with:
      engine_ref: cd9f01d1711d1abce1856ca4052f49e93eaef3ac
