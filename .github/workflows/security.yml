name: Security without native builds
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@fd4b0364fbf90b116a4de552fdecba791b4e8ffa
    with:
      engine_ref: fd4b0364fbf90b116a4de552fdecba791b4e8ffa
