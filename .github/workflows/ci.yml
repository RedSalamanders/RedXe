name: RedXe validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redxe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: windows-2025-vs2026
    # Cold MSVC preparation took 8m45 before the independent tooling could start.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare required MSVC 14.52 tools
        uses: ./.github/actions/setup-msvc
        with:
          platform: x64
      - shell: pwsh
        run: |
          ./Tests/BuildProcessTests/Invoke-ToolingTests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Independent tooling tests failed.' }
  native:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the fast, most informative leg (x64 Release, ~11 min). Pushes to main and manual
        # dispatches run all six configurations; release.yml refuses to release a commit whose push run on main
        # did not pass, so that full matrix is the release gate.
        platform: ${{ fromJson(github.event_name == 'pull_request' && '["x64"]' || '["x64","ARM64"]') }}
        configuration: ${{ fromJson(github.event_name == 'pull_request' && '["Release"]' || '["Debug","Release","ASan Debug"]') }}
    runs-on: ${{ matrix.platform == 'ARM64' && 'windows-11-vs2026-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history so the version stamp is the real commit count, as in a release.
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare required MSVC 14.52 tools
        uses: ./.github/actions/setup-msvc
        with:
          platform: ${{ matrix.platform }}
      - name: Build and test the pinned product
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./test.ps1 -Full -SkipTooling -Configuration '${{ matrix.configuration }}' -Platform '${{ matrix.platform }}'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned product tests failed.' }
          # The lock and the restored source's path are the restore module's, as for the build.
          Import-Module ./Build/DxUiRestore.psm1
          $source=Get-RedXeDxUiSourcePath -RepoRoot $PWD.Path -Commit (Read-RedXeDxUiLock -LockFile Dependencies/DxUi.lock.json).commit
          # DxUi PR 30 replaced the pinned Tools/validate_build_matrix.py with this PowerShell script, which throws on a
          # finding. It resolves -Root against the process directory, so pass the absolute checkout root.
          & (Join-Path $source 'validate-build-matrix.ps1') -Root $PWD.Path
          if (-not $?) { throw 'Native project matrix validation failed.' }
      - name: Exercise native AV resource fixture
        if: matrix.configuration != 'ASan Debug'
        shell: pwsh
        run: ./measure-av-views.ps1 -Configuration '${{ matrix.configuration }}' -SkipBuild -OutputPath .build/reports/av-native-views.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: redxe-${{ matrix.platform }}-${{ matrix.configuration }}
          include-hidden-files: true
          path: |
            .build/logs/**
            .build/evidence/test-runs/**
            .build/reports/**
            .build/test-artifacts/**
            .build/${{ matrix.platform }}/${{ matrix.configuration }}/*.log
            .build/${{ matrix.platform }}/${{ matrix.configuration }}/DxUi.provenance.json
          retention-days: 14
